[tool.coverage.run]
source = ["marketing_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# Exemptions 1-4 from docs/standards/pipeline-testing.md §3 (glue,
# properties, dunder reprs, pure re-exports) — lifted from
# aw-backend/src/tests/.coveragerc, the precedent that section names, same
# as the aw-app-kb pilot (card 3d65bf3b-9510-8173-b347-d834e37aeedf).
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
precision = 1
# Was CI-enforced at 100% (measured, not aspirational — real behavioural
# tests, no import-only stubs). The aw-app-* fleet migration's test.yml
# (DESIGN.md §2/§4.1) replaced this repo's own coverage-gated CI job with
# the fleet's shared no-coverage-gate shape, deferring the coverage-gate
# rollout to that standard's own Phase 2 — not a decision made here, and
# not a lowering of the bar: `fail_under` itself is untouched, only nothing
# in CI runs `pytest --cov` anymore to check it. Still real for a manual
# `pytest --cov=marketing_app` run. The riskiest code in this repo
# (mcp/self_register.py, whose failure mode is SILENT: the gateway keeps
# listing the upstream and serves zero tools) is exactly the code a
# coverage gap would hide — Phase 2 should restore enforcement here first.
fail_under = 100

[tool.pytest.ini_options]
# test.yml runs plain `pytest` (not `python -m pytest`), so the repo root
# never lands on sys.path implicitly and `from marketing_app.X import Y`
# fails to collect. `pythonpath` is native since pytest 7 and fixes both
# the CI invocation and a local `pytest` run without `-m`.
pythonpath = ["."]
# activation.py's tests are async (the approval-poll flow is genuinely async,
# not just a sync function wrapped for form) — "auto" runs every `async def
# test_*` without an `@pytest.mark.asyncio` on each one. requirements-dev.txt
# already carries pytest-asyncio for exactly this.
asyncio_mode = "auto"
